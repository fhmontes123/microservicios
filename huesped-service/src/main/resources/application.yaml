server:
  port: 8081

spring:
  application:
    name: huesped-service
  datasource:
    url: jdbc:mysql://localhost:3306/microservicios
    username: root
    password: 123456
    driver: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect